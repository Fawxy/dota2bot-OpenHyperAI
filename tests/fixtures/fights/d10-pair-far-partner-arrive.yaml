id: fights.join.pair-far-partner-arrive.001
source: playtest
ref: {note: "hand-built for oha-join-arrive (step 4.6a), no game cut"}
status: active
decision: pair_join
# ours pid 0: HP 600, 500 from the target (in its reach); ours pid 1: 1572 from the target, 900 outside its reach (3 s of walking)
# theirs pid 6: HP 400; hits each of ours for 200
world:
  t: 120
  pid: 0
  ally: 0
  ours: [{"pid":0,"x":0,"y":0,"hp":600,"mhp":600,"ret":0},{"pid":1,"x":-1072,"y":0,"hp":600,"mhp":600,"ret":0}]
  theirs: [{"pid":6,"x":500,"y":0,"hp":400,"mhp":600}]
  dmg: [{"from":0,"to":6,"d":100},{"from":1,"to":6,"d":200},{"from":6,"to":0,"d":200},{"from":6,"to":1,"d":200}]
  ar: "0,648,300,24;1,648,300,24;6,648,300,24"
  arv: 1
expect:
  must: ["out(losing)"]
  mustNot: ["join(hero#6)"]
notes: >
  Slice oha-join-arrive (Ours.JoinArrive): the pair looks 3 to 1 on damage (300 of 400 HP over the window against 200 of 600) only
  because the partner 1,572 from the target is counted at a full window. It needs 3 s to walk into range, so its 200 adds nothing:
  our share is 0.25 against theirs 0.33, losing. With the switch off (no `arv`) the same world answers join.
